[workspace]
resolver = "3"
members = [
    "crates/silo-core",
    "crates/silo-platform",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["Cendy"]
license = "MIT"
repository = "https://github.com/cloei/silo"

[workspace.dependencies]
silo-core = { path = "crates/silo-core" }
silo-platform = { path = "crates/silo-platform" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
json5 = "1.3.7"
quick-xml = { version = "0.42.0", features = ["serialize"] }
semver = { version = "1.0.28", features = ["serde"] }
keyvalues-parser = "0.2.4"

rusqlite = { version = "0.42.0", features = ["bundled"] }
zip = "9.5.1"
sevenz-rust2 = "0.25.0"
walkdir = "2.5.0"
dirs = "7.0.0"
junction = "2.1.0"
rfd = "0.18.0"

tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
interprocess = { version = "2.4.7", features = ["tokio"] }

thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
